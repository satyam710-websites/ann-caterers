<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platter Menu · अन्न Ann Caters &amp; Events</title>
  <meta name="description" content="Full platter menu from Ann Caters & Events, Haridwar.">
  <meta name="theme-color" content="#7a1f1f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Mukta:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="legal-page platter-page">

<header class="nav">
  <a href="index.html" class="brand" aria-label="Ann Caters & Events home">
    <img class="brand-logo" src="images/logo-wordmark.png" alt="अन्न Caters &amp; Events">
  </a>
  <div class="nav-actions">
    <a href="index.html#packages" class="btn btn-sm">← All platters</a>
  </div>
</header>

<main class="platter">
  <div class="container">
    <header class="platter-head">
      <img class="print-logo" src="images/logo-wordmark.png" alt="">
      <p class="eyebrow">Proposed menu</p>
      <h1 id="pName"></h1>
      <p class="platter-intro" id="pIntro"></p>
      <div class="platter-actions">
        <a class="btn" id="pDownload" download>⬇ Download PDF</a>
        <a class="btn btn-ghost dark" id="pEnquire" target="_blank" rel="noopener">Enquire on WhatsApp</a>
      </div>
      <nav class="platter-switch" id="pSwitch" aria-label="Other platters"></nav>
    </header>

    <div class="platter-grid" id="pSections"></div>

    <footer class="platter-foot">
      <span class="fleuron">✦</span>
      <p>All menus can be customised to suit your event.</p>
      <p class="print-only" id="pContact"></p>
    </footer>
  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div>
      <img class="footer-logo" src="images/logo-wordmark-light.png" alt="अन्न Caters &amp; Events">
    </div>
    <div class="footer-right">
      <nav class="footer-links"><a href="index.html">Home</a><a href="privacy.html">Privacy Policy</a></nav>
      <p class="copy">© <span id="year"></span> Ann Caters &amp; Events, Haridwar. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/platters.js"></script>
<script src="js/platter-page.js"></script>
</body>
</html>
